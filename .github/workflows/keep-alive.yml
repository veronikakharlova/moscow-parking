name: Keep Supabase awake
 
# Бесплатный проект Supabase уходит в паузу после 7 дней без обращений к базе.
# Этот workflow дважды в неделю делает лёгкий запрос к таблице, чтобы это предотвратить.
# Расписание в UTC: пн 03:00 и чт 03:00 (06:00 / 06:00 по Москве)
on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch: {}
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # Новые ключи Supabase (sb_publishable_...) передаются только в заголовке apikey —
          # заголовок Authorization: Bearer с таким ключом вызовет ошибку "Invalid JWT",
          # поэтому здесь он не используется.
          curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/parkings?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
